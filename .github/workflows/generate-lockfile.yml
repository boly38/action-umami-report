name: Generate updated pnpm lockfile

on:
  pull_request:
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/generate-lockfile.yml'

permissions:
  contents: read

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20.x

      - name: Regenerate lockfile with the project pnpm version
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Verify patched dependency audit
        run: pnpm audit --audit-level moderate

      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pnpm-lockfile
          path: pnpm-lock.yaml
          if-no-files-found: error
